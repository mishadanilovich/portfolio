<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Intercom — form (EN)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&amp;family=Golos+Text:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#232938;font-family:'Golos Text',system-ui,sans-serif;color:#232938}
a{color:#F6C878}a:hover{color:#FBDA96}
input::placeholder,textarea::placeholder{color:#62666F}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #2B3244">
<svg width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs><linearGradient id="i-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B6180"></stop><stop offset="1" stop-color="#2B3244"></stop></linearGradient></defs>
<rect width="1440" height="900" fill="url(#i-sky)"></rect>
<rect x="0" y="720" width="1440" height="180" fill="#232835"></rect>
<rect x="560" y="0" width="540" height="720" fill="#CFC8BB"></rect>
<rect x="863" y="618" width="72" height="102" fill="#FBDA96"></rect>
<path d="M863 720H935L1010 800H790Z" fill="#F6C878" fill-opacity="0.4"></path>
<g fill="#F2B45C"><rect x="734" y="126" width="72" height="84"></rect><rect x="614" y="276" width="72" height="84"></rect><rect x="974" y="426" width="72" height="84"></rect></g>
<rect x="0" y="0" width="1440" height="900" fill="#12151D" fill-opacity="0.62"></rect>
</svg>

<div role="dialog" aria-modal="true" aria-labelledby="ic-title" style="position: absolute; left: 260px; top: 80px; width: 920px; height: 740px; display: flex; border-radius: 10px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.4)">
<div style="width: 300px; flex-shrink: 0; box-sizing: border-box; padding: 36px 32px; background: #2E3548; color: #EDE8DF; display: flex; flex-direction: column; gap: 20px">
<h2 id="ic-title" style="margin: 0; font-family: Literata, Georgia, serif; font-size: 34px; font-weight: 500; line-height: 1.1">Intercom</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #D2CEC6">Leave a job opening — I’ll reply to the contact you provide.</p>
<svg width="236" height="200" viewBox="0 0 236 200" aria-hidden="true">
<circle cx="118" cy="100" r="96" fill="#F6C878" fill-opacity="0.08"></circle>
<rect x="72" y="16" width="92" height="168" rx="10" fill="#1F2430"></rect>
<rect x="84" y="30" width="68" height="24" rx="3" fill="#3A4258"></rect>
<text x="118" y="47" text-anchor="middle" font-family="Golos Text" font-size="12" fill="#F6C878" letter-spacing="1">CALL</text>
<g fill="#5A6075"><circle cx="100" cy="72" r="2"></circle><circle cx="112" cy="72" r="2"></circle><circle cx="124" cy="72" r="2"></circle><circle cx="136" cy="72" r="2"></circle><circle cx="100" cy="82" r="2"></circle><circle cx="112" cy="82" r="2"></circle><circle cx="124" cy="82" r="2"></circle><circle cx="136" cy="82" r="2"></circle><circle cx="100" cy="92" r="2"></circle><circle cx="112" cy="92" r="2"></circle><circle cx="124" cy="92" r="2"></circle><circle cx="136" cy="92" r="2"></circle></g>
<circle cx="118" cy="138" r="22" fill="#2E3548" stroke="#F2B45C" stroke-width="2"></circle>
<circle cx="118" cy="138" r="13" fill="#F2B45C"></circle>
</svg>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 20px; border-top: 1px solid #454D63">
<div style="font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: #B4B9C4">Or directly</div>
<a href="https://t.me/f0pp1" style="font-size: 16px; text-decoration: none">Telegram · @f0pp1</a>
<a href="mailto:danilovich36misha@gmail.com" style="font-size: 15px; text-decoration: none; word-break: break-all">danilovich36misha@gmail.com</a>
</div>
</div>

<form style="flex-grow: 1; box-sizing: border-box; padding: 32px 36px; background: #F4F0E8; display: flex; flex-direction: column; gap: 16px; position: relative">
<button type="button" aria-label="Close" style="position: absolute; right: 20px; top: 20px; width: 44px; height: 44px; border: 1px solid #C9C1B3; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" stroke="#232938" stroke-width="1.8"><path d="M3 3L13 13M13 3L3 13"></path></svg></button>
<div style="font-size: 16px; font-weight: 600; padding-right: 56px">About the role <span style="font-weight: 400; color: #4A5060">— fill in one of the two fields</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-link" style="font-size: 16px; font-weight: 500">Job link</label>
<input id="f-link" type="url" placeholder="https://hh.ru/vacancy/…" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8C8577; border-radius: 6px; background: #FFFFFF; font: 16px 'Golos Text', sans-serif; color: #232938">
</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #4A5060"><div style="flex-grow: 1; height: 1px; background: #D8D1C4"></div>or<div style="flex-grow: 1; height: 1px; background: #D8D1C4"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-desc" style="font-size: 16px; font-weight: 500">Job description</label>
<textarea id="f-desc" rows="3" placeholder="Stack, tasks, work format, salary range — whatever you know" style="box-sizing: border-box; padding: 12px 14px; border: 1px solid #8C8577; border-radius: 6px; background: #FFFFFF; font: 16px/1.5 'Golos Text', sans-serif; color: #232938; resize: vertical"></textarea>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 4px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-company" style="font-size: 16px; font-weight: 500">Company <span style="font-weight: 400; color: #4A5060">— optional</span></label>
<input id="f-company" type="text" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8C8577; border-radius: 6px; background: #FFFFFF; font: 16px 'Golos Text', sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-contact" style="font-size: 16px; font-weight: 500">Contact <span aria-hidden="true" style="color: #A4461E">*</span></label>
<input id="f-contact" type="text" required placeholder="Telegram or email" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8C8577; border-radius: 6px; background: #FFFFFF; font: 16px 'Golos Text', sans-serif">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-comment" style="font-size: 16px; font-weight: 500">Comment <span style="font-weight: 400; color: #4A5060">— optional</span></label>
<textarea id="f-comment" rows="2" style="box-sizing: border-box; padding: 12px 14px; border: 1px solid #8C8577; border-radius: 6px; background: #FFFFFF; font: 16px/1.5 'Golos Text', sans-serif; resize: vertical"></textarea>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: auto">
<button type="submit" style="height: 48px; padding: 0 24px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 6px; background: #F2B45C; color: #2A2116; font: 600 16px 'Golos Text', sans-serif"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2A2116" stroke-width="1.6"><rect x="4" y="1.5" width="10" height="15" rx="1.5"></rect><circle cx="9" cy="11.5" r="2"></circle><path d="M7 5H11M7 7.5H11"></path></svg>Call</button>
<button type="button" style="height: 48px; padding: 0 18px; border: 0; background: transparent; color: #232938; font: 500 16px 'Golos Text', sans-serif">Cancel</button>
<div style="margin-left: auto; font-size: 14px; color: #4A5060"><span aria-hidden="true" style="color: #A4461E">*</span> required</div>
</div>
</form>
</div>
</div>
</body>
</html>
